# Stop command-line audio tools writing their volume into shared memory.
#
# WirePlumber remembers a stream's volume and restores it next time. The bucket it files that under
# is chosen by `formKey` in scripts/node/state-stream.lua, whose priority list begins:
#
#     media.role, application.id, application.name, media.name, node.name
#
# `media.role` is FIRST. And `pw-cat --help` says of the role: "(default Music)". So every
# `pw-play` writes into the shared `Music` bucket ahead of its own name, and every application that
# declares that role -- a video player, a music client's audio-only mode -- inherits whatever the
# last tool left there. `pw-play --volume=0.02` for six seconds is enough to leave the desktop at
# -34 dB indefinitely. A browser is unaffected because it has an entry under its own name, which is
# why the symptom looks like "only some apps went quiet".
#
# `state.restore-props = false` is WirePlumber's own per-stream opt-out -- its bluez and alsa
# monitors set exactly this. Applied here to the tools, it means they are played and forgotten,
# which is what a diagnostic should do.
#
# Verified on this machine: `pw-play --volume=0.02` wrote `volume: 0.020000` to the Music role; the
# same command with this opt-out left it at 1.0.

stream.rules = [
  {
    matches = [
      { application.name = "pw-play" }
      { application.name = "pw-cat" }
      { application.name = "pw-record" }
      { application.name = "speaker-test" }
      { application.name = "paplay" }
      { application.name = "parec" }
    ]
    actions = {
      update-props = {
        state.restore-props  = false
        state.restore-target = false
      }
    }
  }
]

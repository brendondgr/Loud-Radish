[project]
name = "loud-radish"
version = "0.1.0"
description = "Loud Radish — a local live audio and video transcriber with a language-model assistant."
requires-python = ">=3.11"
# PEP 639: an SPDX expression and the file it points at, not the older table form.
license = "MIT"
license-files = ["LICENSE"]
# Everything the application can do is installed by `uv sync`, which `uv run app.py` performs on
# its own. There are **no optional groups** — see Decision D-023.
#
# This reverses D-012, which kept the speech model behind an extra to make installation fast and
# the test suite free of model downloads. Both of those were real, and neither survived contact
# with the actual cost: a user pressing record and being told to go and run a second command is a
# worse first five minutes than a slower first install, and the model weights were never in the
# wheel anyway — `faster-whisper` downloads them on first use, so `uv sync` was never the step that
# fetched them.
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "soxr>=1.1.0",
    "uvicorn[standard]>=0.52.3",
    # Real transcription. Uses CTranslate2 rather than torch, which is why this is tens of
    # megabytes and not gigabytes.
    "faster-whisper>=1.2.1",
    # Microphone and system-loopback capture.
    "sounddevice>=0.5.5",
    # The Silero voice detector, and the decoder's own speech filter (D-019).
    "onnxruntime>=1.28.0",
    # The OS credential store, so API keys never land in a config file (D-017).
    "keyring>=25.7.0",
    # D-Bus, for the screen-cast portal that window capture negotiates through (D-022).
    "jeepney>=0.9.0",
]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "httpx2>=2.10.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "web/frontend", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only the backend. The repository root is deliberately absent: `app.py` lives there, and with the
# root on the path it shadows the `web/backend/app` package — every `from app.config import ...`
# then fails with "'app' is not a package".
pythonpath = ["web/backend"]
# `importlib` rather than the default `prepend`, which inserts the rootdir at the front of sys.path
# for each test module and would reintroduce that shadowing regardless of `pythonpath`.
addopts = "--import-mode=importlib"
# **A run must always end.** `tests/assistant/test_llm_live.py` drains a real model's stream, and
# the only bound underneath it is httpx's 180-second *per-read* timeout — which a slow-drip stream
# never trips. Two tests in `test_window_audio.py` block on an exact byte count from `pw-record`.
# Neither is a hang the suite can detect for itself, so the suite is given a deadline instead. 120s
# is roughly forty times the slowest honest test here (`--durations` puts that at ~3s).
timeout = 120
markers = [
    # Opt-in, because reachability is not consent: the relay on localhost:9090 answers on this
    # machine, so a skipif that only probes for a server *runs* these against a reasoning model
    # every time anyone types `uv run pytest`. Pass `--run-live-llm` to mean it.
    "live_llm: talks to a real OpenAI-compatible server; needs --run-live-llm",
]
